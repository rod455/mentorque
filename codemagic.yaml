# Builds nativos na nuvem (Codemagic).
#
#   lojas             → .ipa + .aab num build só → TestFlight e Google Play
#   ios-testflight    → .ipa assinado → TestFlight
#   android-play      → .aab assinado → Google Play (faixa de teste interno)
#
# O "lojas" é o caminho normal de release: uma máquina Mac compila o web uma
# vez e empacota as duas plataformas. Os dois workflows de uma loja só ficam
# para quando um lado precisa de build e o outro não.
#
# ATENÇÃO — isto mudou e o texto antigo enganava: os dois apps NÃO apontam mais
# para https://mentorque.com.br/app. Desde que passaram a ser empacotados
# (`npm run build:native` → `webDir: native/app`, sem `server.url`), telas,
# estilos e textos viajam DENTRO do binário. Ou seja: mudança de tela, de texto
# ou de preço exige um build novo aqui — deploy da Vercel sozinho não chega ao
# aparelho de ninguém.
#
# O que continua vindo pela rede, e portanto muda só com deploy do site: as
# rotas de /api (Biela, Stripe, FIPE, revisões) e o catálogo remoto de conteúdo
# (lib/app/remoteLessons.ts).
workflows:
  lojas:
    name: iOS + Android → lojas
    # Uma máquina Mac faz os dois: o Android compila normalmente no macOS, e o
    # iOS só compila aqui. Custa minutos de Mac para o lado Android também,
    # mas é UM build, um clique, e o web (npm run build:native) roda uma vez
    # em vez de duas. Atenção ao tudo-ou-nada: se o archive do iOS falhar, o
    # .aab nem chega a ser gerado (e vice-versa não: o Android compila antes,
    # de propósito, por ser o passo mais previsível).
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: asc-mentorque
    environment:
      node: 22
      xcode: latest
      java: 21
      groups:
        - google_play
        - Mentorque
      ios_signing:
        distribution_type: app_store
        bundle_identifier: mentorque.app
      android_signing:
        - mentorque-upload
    scripts:
      - name: Instalar dependências web
        script: npm ci
      - name: Gerar o app estático que vai dentro dos binários
        # Um build web só, embutido nos dois pacotes — é a mesma interface.
        script: npm run build:native
      - name: Esquema do Google no Info.plist
        script: node scripts/ios-google-scheme.mjs
      - name: Sincronizar Capacitor (iOS e Android)
        script: npx cap sync
      - name: Assinatura Android (keystore do Codemagic → keystore.properties)
        script: |
          cat > android/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Compilar .aab
        script: |
          # A Play recusa versionCode repetido. O número da build incrementa a
          # cada rodada; o piso do gradle.properties protege contra o contador
          # do Codemagic estar atrás de um número já enviado por fora (os
          # builds feitos à mão no Android Studio não passam por aqui).
          piso=$(grep -o 'mentorqueVersionCode=[0-9]*' android/gradle.properties | cut -d= -f2)
          v=$(( ${PROJECT_BUILD_NUMBER:-0} + 1 ))
          [ "$v" -lt "${piso:-1}" ] && v=$piso
          export MENTORQUE_VERSION_CODE=$v
          echo "versionCode deste envio: $v"
          cd android
          ./gradlew bundleRelease
      - name: Aplicar perfis de assinatura (iOS)
        script: xcode-project use-profiles
      - name: Conferir os perfis baixados
        # Igual ao do ios-testflight: um perfil sem a capability do Sign In
        # with Apple só quebraria lá na frente, com erro vago; aqui a gente
        # abre o perfil e falha cedo, com instrução de conserto.
        script: |
          shopt -s nullglob
          achou=0
          serve=0
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            achou=1
            security cms -D -i "$p" > /tmp/perfil.plist 2>/dev/null || continue
            nome=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/perfil.plist 2>/dev/null)
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/perfil.plist 2>/dev/null)
            criado=$(/usr/libexec/PlistBuddy -c "Print :CreationDate" /tmp/perfil.plist 2>/dev/null)
            echo "--- $nome"
            echo "    uuid:   $uuid"
            echo "    criado: $criado"
            if grep -q "com.apple.developer.applesignin" /tmp/perfil.plist; then
              echo "    Sign In with Apple: SIM"
              serve=1
            else
              echo "    Sign In with Apple: NAO"
            fi
          done
          [ "$achou" = "1" ] || echo "(nenhum perfil foi baixado)"
          if [ "$serve" != "1" ]; then
            echo ""
            echo "Nenhum perfil baixado autoriza Sign In with Apple — o archive vai falhar."
            echo ""
            echo "O perfil NAO vem da Apple: vem da copia guardada no painel do Codemagic"
            echo "(Teams -> Integrations -> Code signing identities -> iOS provisioning"
            echo "profiles). Apagar no portal da Apple nao tem efeito nenhum aqui."
            echo ""
            echo "Para resolver: gere um perfil de App Store novo no portal da Apple,"
            echo "baixe o .mobileprovision e substitua a copia guardada no Codemagic."
            exit 1
          fi
      - name: Número da build (iOS, incremental)
        script: |
          cd ios/App
          agvtool new-version -all $((${PROJECT_BUILD_NUMBER:-0} + 1))
          # O número fica no log de propósito: é ele que vai em /api/app/latest
          # depois que a loja publicar, sem precisar abrir o App Store Connect.
          echo "Build iOS deste envio (CFBundleVersion): $(agvtool what-version -terse)"
      - name: Compilar .ipa
        script: |
          # Mesmo desenterro de log do ios-testflight: o xcode-project engole a
          # saída real do xcodebuild.
          if ! xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App; then
            echo ""
            echo "===================== erro real do xcodebuild ====================="
            found=0
            for f in /tmp/xcodebuild_logs/*.log; do
              [ -f "$f" ] || continue
              found=1
              echo "--- $f"
              grep -nE "error:|fatal|Provisioning profile|entitlement|Signing for|does(n't| not) (support|contain)|failed to (resolve|download)" "$f" | tail -80
            done
            if [ "$found" = "0" ]; then
              echo "(nenhum log em /tmp/xcodebuild_logs — últimas linhas de qualquer log encontrado)"
              find /tmp /Users/builder/clone/build -name "*.log" -newermt "-30 minutes" 2>/dev/null | head -5 | while read -r f; do
                echo "--- $f"; tail -60 "$f"
              done
            fi
            echo "==================================================================="
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: asc-mentorque
    environment:
      node: 22
      xcode: latest
      groups:
        # Variáveis do build web (Codemagic → Applications → Mentorque →
        # Environment variables). O nome abaixo é o do GRUPO lá no painel e
        # precisa bater exatamente — se não bater, o build nem começa. Elas
        # são embutidas no pacote, então precisam existir AQUI, não só na
        # Vercel:
        #   NEXT_PUBLIC_SUPABASE_URL        login e banco
        #   NEXT_PUBLIC_SUPABASE_ANON_KEY   idem
        #   NEXT_PUBLIC_SITE_URL            https://mentorque.com.br — para onde
        #                                   o app manda os fetch de /api
        #   NEXT_PUBLIC_REVENUECAT_IOS_KEY  assinatura pela Apple
        #
        # O Android usa NEXT_PUBLIC_REVENUECAT_ANDROID_KEY no lugar dessa. Ela
        # é o interruptor da venda pelo Play Billing: sem ela, o build do
        # Android sai em modo leitor (sem paywall).
        #
        # O client id do Google NÃO precisa entrar aqui: ele é público (viaja
        # dentro do binário) e está fixo em lib/app/socialLogin.ts.
        #
        # Stripe NÃO entra: no app nativo o paywall desvia para a compra da
        # Apple antes de qualquer caminho do Stripe, então a tela de checkout
        # é inalcançável no iOS.
        - Mentorque
      # Certificado e perfil vêm de Code signing identities, no painel do
      # Codemagic — enviados à mão. Este bloco só ESCOLHE entre eles, pelo
      # bundle id e pelo tipo de distribuição; não cria nada.
      #
      # Já tentei trocar por `app-store-connect fetch-signing-files --create`,
      # que criaria na Apple: ele exige uma CERTIFICATE_PRIVATE_KEY que não
      # existe aqui e falha com "Cannot save Signing Certificates without
      # certificate private key". Enquanto essa chave não estiver no grupo de
      # variáveis, o caminho é o manual.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: mentorque.app
    scripts:
      - name: Instalar dependências web
        script: npm ci
      - name: Gerar o app estático que vai dentro do binário
        # Sem isso o webDir (native/app) não existe: o app é empacotado, não
        # aponta mais para o site. Precisa das variáveis NEXT_PUBLIC_* abaixo.
        script: npm run build:native
      - name: Esquema do Google no Info.plist
        # O esquema já está commitado; este passo só reescreve se alguém tiver
        # definido NEXT_PUBLIC_GOOGLE_IOS_CLIENT_ID para outro projeto do
        # Google Cloud. Sem o esquema, o botão do Google não abre nada.
        script: node scripts/ios-google-scheme.mjs
      - name: Sincronizar Capacitor iOS
        script: npx cap sync ios
      - name: Aplicar perfis de assinatura
        script: xcode-project use-profiles
      - name: Conferir os perfis baixados
        # Um perfil emitido ANTES de a capability entrar no App ID continua
        # sendo baixado normalmente, e o archive só quebra lá na frente com
        # "doesn't include the Sign In with Apple capability". Aqui a gente
        # abre o perfil e diz na cara se ele serve ou não.
        script: |
          shopt -s nullglob
          achou=0
          serve=0
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            achou=1
            security cms -D -i "$p" > /tmp/perfil.plist 2>/dev/null || continue
            nome=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/perfil.plist 2>/dev/null)
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/perfil.plist 2>/dev/null)
            criado=$(/usr/libexec/PlistBuddy -c "Print :CreationDate" /tmp/perfil.plist 2>/dev/null)
            echo "--- $nome"
            echo "    uuid:   $uuid"
            echo "    criado: $criado"
            if grep -q "com.apple.developer.applesignin" /tmp/perfil.plist; then
              echo "    Sign In with Apple: SIM"
              serve=1
            else
              echo "    Sign In with Apple: NAO"
            fi
          done
          [ "$achou" = "1" ] || echo "(nenhum perfil foi baixado)"
          if [ "$serve" != "1" ]; then
            echo ""
            echo "Nenhum perfil baixado autoriza Sign In with Apple — o archive vai falhar."
            echo ""
            echo "O perfil NAO vem da Apple: vem da copia guardada no painel do Codemagic"
            echo "(Teams -> Integrations -> Code signing identities -> iOS provisioning"
            echo "profiles). Apagar no portal da Apple nao tem efeito nenhum aqui."
            echo ""
            echo "Para resolver: gere um perfil de App Store novo no portal da Apple,"
            echo "baixe o .mobileprovision e substitua a copia guardada no Codemagic."
            exit 1
          fi
      - name: Número da build (incremental)
        script: |
          cd ios/App
          agvtool new-version -all $((${PROJECT_BUILD_NUMBER:-0} + 1))
          # O número fica no log de propósito: é ele que vai em /api/app/latest
          # depois que a loja publicar, sem precisar abrir o App Store Connect.
          echo "Build iOS deste envio (CFBundleVersion): $(agvtool what-version -terse)"
      - name: Compilar .ipa
        script: |
          # `xcode-project` engole a saída do xcodebuild e devolve só "exited
          # with status code 65" — inútil para descobrir o que quebrou. O erro
          # de verdade fica no log que ele grava em /tmp/xcodebuild_logs, então
          # em caso de falha a gente desenterra e imprime aqui mesmo.
          if ! xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App; then
            echo ""
            echo "===================== erro real do xcodebuild ====================="
            found=0
            for f in /tmp/xcodebuild_logs/*.log; do
              [ -f "$f" ] || continue
              found=1
              echo "--- $f"
              grep -nE "error:|fatal|Provisioning profile|entitlement|Signing for|does(n't| not) (support|contain)|failed to (resolve|download)" "$f" | tail -80
            done
            if [ "$found" = "0" ]; then
              echo "(nenhum log em /tmp/xcodebuild_logs — últimas linhas de qualquer log encontrado)"
              find /tmp /Users/builder/clone/build -name "*.log" -newermt "-30 minutes" 2>/dev/null | head -5 | while read -r f; do
                echo "--- $f"; tail -60 "$f"
              done
            fi
            echo "==================================================================="
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      # O erro real do xcodebuild não cabe na tela do passo — o Codemagic dobra
      # a saída. Baixar este log é o caminho curto quando o archive falha.
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Configuração única no painel do Codemagic (codemagic.io):
  # 1. Teams → Integrations → Code signing identities → Android keystores:
  #    subir o .jks com o nome de referência "mentorque-upload".
  # 2. Variáveis do grupo "google_play": GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #    com o JSON da conta de serviço (Play Console → Configuração → acesso
  #    via API), marcada como secreta.
  android-play:
    name: Android → Google Play (teste interno)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      groups:
        - google_play
        # As MESMAS variáveis do iOS: desde que o app deixou de apontar para o
        # site, o Android também é empacotado e precisa delas embutidas.
        - Mentorque
      android_signing:
        - mentorque-upload
    scripts:
      - name: Instalar dependências web
        script: npm ci
      - name: Gerar o app estático que vai dentro do binário
        # Sem isto o `webDir` (native/app) não existe e o `cap sync` falha com
        # "Could not find the web assets directory". O passo faltava desde que
        # o app parou de apontar para o site e passou a ser empacotado.
        script: npm run build:native
      - name: Sincronizar Capacitor Android
        script: npx cap sync android
      - name: Assinatura (keystore do Codemagic → keystore.properties)
        script: |
          cat > android/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Compilar .aab
        script: |
          # A Play recusa versionCode repetido. O número da build incrementa a
          # cada rodada; o piso do gradle.properties protege contra o contador
          # do Codemagic estar atrás de um número já enviado por fora (os
          # builds feitos à mão no Android Studio não passam por aqui).
          piso=$(grep -o 'mentorqueVersionCode=[0-9]*' android/gradle.properties | cut -d= -f2)
          v=$(( ${PROJECT_BUILD_NUMBER:-0} + 1 ))
          [ "$v" -lt "${piso:-1}" ] && v=$piso
          export MENTORQUE_VERSION_CODE=$v
          echo "versionCode deste envio: $v"
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      # mapping.txt desofusca os stack traces do R8 no Play Console.
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Promoção para produção é manual, no Play Console.
        submit_as_draft: false
