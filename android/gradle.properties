# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Memória do daemon. O padrão do template (1536m) faz o R8 estourar heap no
# build de release em máquinas com vários módulos do Capacitor.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Módulos independentes (app + os do Capacitor) compilam em paralelo, e o
# cache evita recompilar o que não mudou entre builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Cada módulo gera só o próprio R — reduz o tamanho do dex e o tempo de build.
android.nonTransitiveRClass=true

# Número da build para a Google Play. INCREMENTE A CADA ENVIO: um versionCode
# já enviado fica queimado, mesmo que a versão tenha sido reprovada.
# O CI ignora este valor e usa o número da build (MENTORQUE_VERSION_CODE).
#   1 → primeiro envio, reprovado por funcionalidade mínima
#   2 → correções de conteúdo, anúncios, telas grandes e login — APROVADO (1.0)
#   3-5 → queimados em tentativas de build locais
#   6 → 1.1 na faixa Alpha: capas novas, Biela mais curta e com memória, folha
#        de nota, modo leitor deixando de ser beco, e a biblioteca do Play
#        Billing dentro do pacote (é ela que destrava o menu de Assinaturas)
#   7 → reservado a um possível envio manual pelo Android Studio (ago/2026);
#        pulado por segurança — número pulado não faz falta, repetido trava
#   8 → próximo envio: Play Billing ligado (ofertas exit10/exit25/save30)
#   9 → próximo envio: funil dentro do app (uso e ativação medidos nas
#        lojas), capas locais, tela de artigo e campo de data corrigidos,
#        popup mensal de km, avaliação por loja, CTA do teste por plano e
#        fim do lembrete que não lembrava
#  10 → 1.2: quiz diário (pergunta do dia, sequência com perdão semanal),
#        notificação local de verdade no Android e no iPhone, sino de avisos
#        no cabeçalho, troca de carro no Início e a correção do pagamento que
#        deixava quem pagava vendo plano gratuito
#  11 → 1.3: conserto dos lembretes que nunca eram agendados (armadilha do
#        then no proxy do Capacitor), ano no seletor de carro e Calendário
#        nomeando o carro ativo
#  12 → 1.4: atribuição de instalação (SDK do AppsFlyer) para as campanhas
#        de Meta e Google Ads; push embarcado na 1.3 segue igual
#  13 → 1.5: Calendário dizendo quando cada revisão cai (data e km) e a
#        sugestão de resolver tudo numa ida só; fim das revisões que
#        nasciam "vencidas" em carro usado sem histórico; convite a salvar
#        a garagem depois do primeiro carro; e o botão voltar do Android
#        que expulsava do app em vez de voltar de aba
#  52 → 1.6: eventos da primeira sessão (comecou_onboarding,
#        terminou_onboarding, abriu_cadastro_de_carro), anon_id que parou de
#        colar todo aparelho sem armazenamento num só, sete aulas viraram
#        artigo completo e cinco travessões saíram do texto de tela
#
# ATENÇÃO, E ESTE PARÁGRAFO EXISTE PARA MATAR UM ALARME FALSO QUE JÁ DEU DUAS
# VEZES: o "Index" que a tela do Codemagic mostra NÃO é o PROJECT_BUILD_NUMBER.
#
# Em 01/09/2026 a tela dizia "Index: 12" e eu concluí que o CI ia emitir
# versionCode 14, o que faria a Play recusar o envio (ela já tem o 51 em
# produção). Errado, e pela segunda vez: o contador do Codemagic é do PROJETO e
# já estava perto de 51, que foi justamente o número com que a 1.5 saiu. A
# build correu sem cancelar e saiu certa. Antes de mim, a mesma dúvida já tinha
# aparecido na rodada anterior.
#
# COMO CONFERIR DE VERDADE, e é a única forma que vale: o log do passo
# "Compilar .aab" imprime a linha `versionCode deste envio: N`. Essa linha é a
# resposta. O Index da tela não é, e o número deste arquivo também não é.
#
# O piso subiu para 52 e fica: ele é inofensivo quando o contador está à
# frente (a regra é `[ "$v" -lt "$piso" ] && v=$piso`, então o maior ganha) e
# protege se algum dia o contador ficar atrás de um envio feito por fora.
# versionCode só precisa CRESCER, e buraco no meio não incomoda. Se um dia
# precisar mexer, a fonte que manda é Play Console → Produção → Versões →
# "Códigos de versão".
mentorqueVersionCode=52
