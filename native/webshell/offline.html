<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mentorque — sem conexão</title>
    <style>
      /* Auto-contido de propósito: esta página é o último recurso quando a
         rede falhou, então não pode depender de nenhum arquivo remoto. */
      :root {
        --graphite: #16181d;
        --graphite-800: #1e222b;
        --graphite-700: #272c35;
        --cream: #f4f2ec;
        --amber: #f2a623;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          max(env(safe-area-inset-top), 24px)
          max(env(safe-area-inset-right), 24px)
          max(env(safe-area-inset-bottom), 24px)
          max(env(safe-area-inset-left), 24px);
        background: var(--graphite);
        color: var(--cream);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main { max-width: 22rem; }
      .mark {
        display: grid;
        place-items: center;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1.125rem;
        background: rgba(242, 166, 35, 0.15);
        color: var(--amber);
        font-size: 1.75rem;
        font-weight: 700;
      }
      h1 { margin: 0; font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.9375rem;
        line-height: 1.6;
        color: rgba(244, 242, 236, 0.6);
      }
      button {
        margin-top: 1.75rem;
        width: 100%;
        padding: 0.875rem 1.5rem;
        border: 0;
        border-radius: 999px;
        background: var(--amber);
        color: var(--graphite);
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.99); }
      button[disabled] { opacity: 0.6; }
      .hint {
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: rgba(244, 242, 236, 0.35);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">M</div>
      <h1>Sem conexão</h1>
      <p>
        O Mentorque precisa de internet para carregar a sua garagem. Verifique o
        Wi-Fi ou os dados móveis e tente de novo.
      </p>
      <button id="retry" type="button">Tentar de novo</button>
      <p class="hint" id="hint" hidden>Ainda sem conexão. Tentando novamente…</p>
    </main>

    <script>
      // Mesma URL do `server.url` em capacitor.config.ts. Mantenha em sincronia.
      var APP_URL = "https://mentorque.com.br/app";
      var retry = document.getElementById("retry");
      var hint = document.getElementById("hint");

      function reload() {
        if (navigator.onLine === false) {
          hint.hidden = false;
          return;
        }
        retry.disabled = true;
        window.location.replace(APP_URL);
      }

      retry.addEventListener("click", reload);
      // A rede voltou sozinha (saiu do túnel, Wi-Fi conectou): volta ao app.
      window.addEventListener("online", reload);
    </script>
  </body>
</html>
